# This workflow will build the Copper golang project using its Makefile
name: Go Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        # Upgraded to 1.26 to match Copper's system requirements
        go-version: '1.26'

    # Runs your Makefile target to compile both Linux and Windows binaries
    - name: Compile with Makefile
      run: make all

    # - name: Run Tests
    #  run: go test -v ./...
    
    #  Uploads the compiled binaries to the Action run page
    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: copper-compiled-binaries
        path: |
          copper_bmc/bin/
          copper_control_plane/bin/
    
    # Only runs when a version tag (v*) is pushed, publishing them directly to the Release Page
    - name: Upload Binaries to GitHub Release Assets
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          copper_bmc/bin/copper_bmc
          copper_bmc/bin/copper_bmc.exe
          copper_control_plane/bin/copper_control_plane
          copper_control_plane/bin/copper_cp.exe

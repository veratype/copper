# This workflow will build the Copper golang project using its Makefile
name: Go Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        # Upgraded to 1.26 to match Copper's system requirements
        go-version: '1.26'

    # Runs your Makefile target to compile both Linux and Windows binaries
    - name: Compile with Makefile
      run: make all

    # - name: Run Tests
    #  run: go test -v ./...
    
    #  Uploads the compiled binaries to the Action run page
    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: copper-compiled-binaries
        path: |
          copper_bmc/bin/
          copper_control_plane/bin/
    
    - name: Publish GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: "v0.1.${{ github.run_number }}"
        name: "Release v0.1.${{ github.run_number }}"
        generate_release_notes: true
        files: |
          copper_bmc/bin/*
          copper_control_plane/bin/*
